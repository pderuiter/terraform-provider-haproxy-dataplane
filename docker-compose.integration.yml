# Integration environment for scripts/registry_*integration.sh. No published
# ports: the scripts reach every service over the compose network, and host
# ports would collide on the shared CI docker host. For a local environment
# with ports, use docker-compose.yml.
services:
  haproxy:
    image: haproxytech/haproxy-debian:s6-latest
    depends_on:
      - consul
      - echo

  consul:
    image: hashicorp/consul:2.1.0
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0

  echo:
    image: hashicorp/http-echo:1.0
    command: ["-text=hello-from-consul", "-listen=:5678"]
