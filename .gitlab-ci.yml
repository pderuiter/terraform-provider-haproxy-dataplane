---
# Terraform provider written in Go: the toolkit Go pipeline (golangci-lint,
# go vet, gofmt, unit tests, build; SonarQube comes with it). Not
# templates/infra/terraform-apply.yml -- that is for applying live
# infrastructure, and this repo has none.
include:
  - project: "wbyc/infra/ci-cd-toolkit"
    ref: "$CI_CD_TOOLKIT_VERSION"
    file: "/templates/ci/go.yml"

variables:
  # main.go lives in the repository root.
  GO_MAIN_PACKAGE: "."
  # base-go release (Go, golangci-lint, govulncheck). The toolkit default
  # (1.0.1, Go 1.27.2) fails scan:govulncheck on GO-2026-6859/GO-2026-6809.
  BASE_GO_VERSION: "1.2.0"
